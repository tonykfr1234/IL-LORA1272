ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    DirectoryIndex index.php
    LimitRequestBody 1048576

    <Directory /var/www/html>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    ErrorLog /proc/self/fd/2
    # Do not log query strings: legacy clients may send APIKey in the query.
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" gateway
    CustomLog /proc/self/fd/1 gateway
</VirtualHost>
