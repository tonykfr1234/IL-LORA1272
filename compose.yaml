services:
  web:
    build:
      context: .
      dockerfile: LoRa-Gateway/Gateway/Docker/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: loragateway
      DB_USER: loragateway
      DB_PASSWORD: ${DB_PASSWORD:?Generate private settings with python scripts/init_env.py}
      DB_TABLE: IoTTable
      IOT_API_KEY: ${IOT_API_KEY:?Generate private settings with python scripts/init_env.py}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(json_decode(file_get_contents('http://127.0.0.1/AjaxIoT.php?action=list'), true)['Result'] === 'OK' ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  db:
    image: mariadb:11.4.13@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
    environment:
      MARIADB_DATABASE: loragateway
      MARIADB_USER: loragateway
      MARIADB_PASSWORD: ${DB_PASSWORD:?Generate private settings with python scripts/init_env.py}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Generate private settings with python scripts/init_env.py}
    volumes:
      - gateway_data:/var/lib/mysql
      - ./deploy/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  gateway_data:
